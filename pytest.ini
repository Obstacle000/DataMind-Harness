[pytest]
# 自动扫描的测试目录
testpaths = src/test

# 自动把项目根目录加入 sys.path，测试文件里再也不用手动 sys.path.insert
pythonpath = .

# 测试文件 / 类 / 函数命名约定
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 默认输出详细用例名，并强制校验所有 @pytest.mark 必须在此注册
addopts = -v --strict-markers

# 按业务域注册分类标签（可用 pytest -m security 只跑安全用例）
markers =
    unit: 通用纯逻辑单元测试
    schema: Schema-Map 血缘骨架、PageRank 与二分控预算测试
    security: SQL AST 安全审计与 EXPLAIN 成本门禁测试
    concurrency: 异步并发与锁安全测试
